# Zena Network - Read-Only RPC Node Configuration
# Dedicated gateway for apps/node, apps/settle, apps/hub, and developers
node-private-key-file = "/opt/besu/keys/key"

rpc-http-enabled = true
rpc-http-host = "0.0.0.0"
rpc-http-port = 8545
rpc-http-api = ["ETH", "NET", "WEB3", "QBFT", "TXPOOL"]
rpc-http-cors-origins = ["*"]

rpc-ws-enabled = true
rpc-ws-host = "0.0.0.0"
rpc-ws-port = 8546
rpc-ws-api = ["ETH", "NET", "WEB3", "QBFT"]

