name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install · Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` input: the version comes from "packageManager" in package.json.
        # Setting both makes the action fail with "Multiple versions of pnpm specified".

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Solidity contracts
        run: pnpm --filter @zena/contracts compile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test
        env:
          NODE_ENV: test

      # Remote Turborepo cache is opt-in.
      # Set TURBO_TOKEN and TURBO_TEAM as repository secrets and uncomment:
